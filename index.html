<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20以內1位數加法速算大冒險</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for cute rounded CJK typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        rounded: ['"M PLUS Rounded 1c"', 'Fredoka', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            yellow: '#FFD166',
                            green: '#06D6A0',
                            blue: '#118AB2',
                            pink: '#EF476F',
                            purple: '#8338EC',
                            orange: '#FF9F1C'
                        }
                    }
                }
            }
        }
    </script>

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Cute 3D Button styles */
        .btn-3d {
            transition: all 0.08s ease;
            box-shadow: 0 6px 0 0 rgba(0, 0, 0, 0.2);
        }
        .btn-3d:active, .btn-3d.active-key {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.2);
        }

        /* Keypad specific press state */
        .key-btn {
            box-shadow: 0 5px 0 0 #CBD5E1;
        }
        .key-btn:active, .key-btn.active-key {
            transform: translateY(3px);
            box-shadow: 0 2px 0 0 #CBD5E1;
        }

        /* Animated effects */
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-short {
            animation: bounce-short 0.4s ease infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes pop-in {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Pulse glow for answer input box */
        .input-glow {
            box-shadow: 0 0 15px rgba(17, 138, 178, 0.4);
        }

        /* Confetti canvas overlay */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>

    <script>
        /* ==========================================================================
           1. Audio Synthesizer (Web Audio API)
           ========================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type = 'sine', duration = 0.1, delay = 0) {
                if (this.muted) return;
                this.init();
                
                setTimeout(() => {
                    try {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                        
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        
                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    } catch (e) {
                        console.error(e);
                    }
                }, delay * 1000);
            }

            // Click key sound
            playKey() {
                this.playTone(400, 'triangle', 0.05);
            }

            // Correct answer chime (pleasant double beep)
            playCorrect() {
                this.playTone(523.25, 'sine', 0.1, 0);   // C5
                this.playTone(659.25, 'sine', 0.15, 0.08); // E5
                this.playTone(783.99, 'sine', 0.25, 0.16); // G5
            }

            // Incorrect answer buzz
            playIncorrect() {
                this.playTone(180, 'sawtooth', 0.2, 0);
                this.playTone(140, 'sawtooth', 0.25, 0.08);
            }

            // Victory Fanfare
            playVictory() {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    this.playTone(freq, 'triangle', 0.2, idx * 0.1);
                });
            }
        }

        const sound = new SoundEngine();

        /* ==========================================================================
           2. Particle Confetti System for Victory Celebration
           ========================================================================== */
        class ConfettiSystem {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.animating = false;

                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            launch() {
                this.particles = [];
                const colors = ['#EF476F', '#FFD166', '#06D6A0', '#118AB2', '#8338EC', '#FF9F1C'];
                for (let i = 0; i < 70; i++) {
                    this.particles.push({
                        x: this.canvas.width / 2,
                        y: this.canvas.height / 2,
                        vx: (Math.random() - 0.5) * 14,
                        vy: (Math.random() - 0.8) * 16,
                        size: Math.random() * 8 + 6,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * 360,
                        rSpeed: (Math.random() - 0.5) * 10,
                        gravity: 0.35,
                        opacity: 1
                    });
                }
                if (!this.animating) {
                    this.animating = true;
                    this.loop();
                }
            }

            loop() {
                if (!this.animating) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                let alive = false;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.rotation += p.rSpeed;
                    p.opacity -= 0.008;

                    if (p.opacity > 0) {
                        alive = true;
                        this.ctx.save();
                        this.ctx.translate(p.x, p.y);
                        this.ctx.rotate((p.rotation * Math.PI) / 180);
                        this.ctx.globalAlpha = Math.max(0, p.opacity);
                        this.ctx.fillStyle = p.color;
                        this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        this.ctx.restore();
                    }
                });

                if (alive) {
                    requestAnimationFrame(() => this.loop());
                } else {
                    this.animating = false;
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                }
            }
        }

        const confetti = new ConfettiSystem('confetti-canvas');

        /* ==========================================================================
           3. Core Game Logic
           ========================================================================== */
        const TOTAL_QUESTIONS = 5;

        // Game State
        let state = {
            questions: [],
            currentIndex: 0,
            currentInput: '',
            startTime: null,
            timerInterval: null,
            elapsedSeconds: 0,
            userAnswers: [],
            isProcessing: false,
            bestTime: localStorage.getItem('math_speed_best_time') ? parseFloat(localStorage.getItem('math_speed_best_time')) : null
        };

        // DOM Elements
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };

        const soundToggleBtn = document.getElementById('sound-toggle');
        const soundIcon = document.getElementById('sound-icon');
        const bestScoreDisplay = document.getElementById('best-score-display');

        const num1El = document.getElementById('num1');
        const num2El = document.getElementById('num2');
        const answerTextEl = document.getElementById('answer-text');
        const cursorEl = document.getElementById('cursor');
        const questionCard = document.getElementById('question-card');
        const feedbackMsg = document.getElementById('feedback-message');
        const feedbackText = document.getElementById('feedback-text');

        const currentQNumEl = document.getElementById('current-q-num');
        const starProgressEl = document.getElementById('star-progress');
        const timerDisplay = document.getElementById('timer-display');

        // Sound Toggle
        soundToggleBtn.addEventListener('click', () => {
            sound.muted = !sound.muted;
            soundIcon.textContent = sound.muted ? '🔇' : '🔊';
        });

        // Initialize Best Score Display
        function updateBestScoreUI() {
            if (state.bestTime !== null) {
                bestScoreDisplay.textContent = `${state.bestTime.toFixed(1)} 秒`;
            } else {
                bestScoreDisplay.textContent = '無紀錄';
            }
        }
        updateBestScoreUI();

        /**
         * Generate 1-digit + 1-digit addition question.
         * Both numbers range from 1 to 9.
         */
        function generateSingleDigitQuestion() {
            const a = Math.floor(Math.random() * 9) + 1; // 1 to 9
            const b = Math.floor(Math.random() * 9) + 1; // 1 to 9
            return {
                num1: a,
                num2: b,
                answer: a + b
            };
        }

        // Generate full set of 5 questions ensuring variety
        function generateQuestionSet() {
            const list = [];
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                let q = generateSingleDigitQuestion();
                // avoid exact duplicates back to back
                if (i > 0 && list[i - 1].num1 === q.num1 && list[i - 1].num2 === q.num2) {
                    q = generateSingleDigitQuestion();
                }
                list.push(q);
            }
            return list;
        }

        // Switch visible view
        function showScreen(screenKey) {
            Object.keys(screens).forEach(key => {
                if (key === screenKey) {
                    screens[key].classList.remove('hidden');
                    screens[key].classList.add('flex');
                } else {
                    screens[key].classList.add('hidden');
                    screens[key].classList.remove('flex');
                }
            });
        }

        // Start Game
        function startGame() {
            sound.init();
            state.questions = generateQuestionSet();
            state.currentIndex = 0;
            state.currentInput = '';
            state.userAnswers = [];
            state.elapsedSeconds = 0;
            state.isProcessing = false;

            // Render star progress indicators
            starProgressEl.innerHTML = '';
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const star = document.createElement('span');
                star.className = 'text-slate-300 text-sm transition-all duration-300';
                star.textContent = '★';
                star.id = `star-indicator-${i}`;
                starProgressEl.appendChild(star);
            }

            showScreen('game');
            renderQuestion();
            startTimer();
        }

        // Timer Logic
        function startTimer() {
            clearInterval(state.timerInterval);
            state.startTime = Date.now();
            timerDisplay.textContent = '0.0';
            
            state.timerInterval = setInterval(() => {
                const now = Date.now();
                state.elapsedSeconds = (now - state.startTime) / 1000;
                timerDisplay.textContent = state.elapsedSeconds.toFixed(1);
            }, 100);
        }

        function stopTimer() {
            clearInterval(state.timerInterval);
        }

        // Render current question
        function renderQuestion() {
            const q = state.questions[state.currentIndex];
            num1El.textContent = q.num1;
            num2El.textContent = q.num2;
            currentQNumEl.textContent = state.currentIndex + 1;
            
            state.currentInput = '';
            updateInputDisplay();

            // Reset feedback
            feedbackMsg.classList.add('opacity-0');
            questionCard.classList.remove('animate-shake');
        }

        // Update Input Field
        function updateInputDisplay() {
            answerTextEl.textContent = state.currentInput;
            if (state.currentInput.length > 0) {
                cursorEl.classList.add('hidden');
            } else {
                cursorEl.classList.remove('hidden');
            }
        }

        // Handle numeric and action keys
        function handleKeyInput(key) {
            if (state.isProcessing) return;

            sound.playKey();

            if (key >= '0' && key <= '9') {
                if (state.currentInput.length < 2) { // Max answer is 20 (2 digits)
                    state.currentInput += key;
                    updateInputDisplay();
                }
            } else if (key === 'backspace') {
                state.currentInput = state.currentInput.slice(0, -1);
                updateInputDisplay();
            } else if (key === 'enter') {
                submitAnswer();
            }
        }

        // Check user answer
        function submitAnswer() {
            if (state.currentInput.trim() === '' || state.isProcessing) return;

            const q = state.questions[state.currentIndex];
            const userNum = parseInt(state.currentInput, 10);
            const isCorrect = (userNum === q.answer);

            state.isProcessing = true;

            // Record result
            state.userAnswers.push({
                num1: q.num1,
                num2: q.num2,
                userAns: userNum,
                correctAns: q.answer,
                isCorrect: isCorrect
            });

            // Visual and audio feedback
            const indicator = document.getElementById(`star-indicator-${state.currentIndex}`);

            if (isCorrect) {
                sound.playCorrect();
                if (indicator) {
                    indicator.textContent = '★';
                    indicator.className = 'text-amber-400 text-sm scale-125 transition-all duration-300';
                }

                feedbackText.textContent = '🎉 答對了！太棒了！';
                feedbackText.className = 'px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 font-black animate-pop';
                feedbackMsg.classList.remove('opacity-0');

                setTimeout(() => {
                    nextQuestion();
                }, 700);

            } else {
                sound.playIncorrect();
                questionCard.classList.add('animate-shake');
                if (indicator) {
                    indicator.textContent = '✖';
                    indicator.className = 'text-rose-400 text-sm font-black transition-all duration-300';
                }

                feedbackText.textContent = `💪 再加油！正確答案是 ${q.answer}`;
                feedbackText.className = 'px-3 py-1 rounded-full bg-rose-100 text-rose-700 font-black animate-pop';
                feedbackMsg.classList.remove('opacity-0');

                setTimeout(() => {
                    questionCard.classList.remove('animate-shake');
                    nextQuestion();
                }, 1100);
            }
        }

        // Advance to next question or complete game
        function nextQuestion() {
            state.currentIndex++;
            state.isProcessing = false;

            if (state.currentIndex < TOTAL_QUESTIONS) {
                renderQuestion();
            } else {
                endGame();
            }
        }

        // End Game & Show Results
        function endGame() {
            stopTimer();

            const correctCount = state.userAnswers.filter(a => a.isCorrect).length;
            const finalTime = state.elapsedSeconds;

            // Update UI elements
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('total-time').textContent = finalTime.toFixed(1);

            // Stars & Evaluation logic
            const starsContainer = document.getElementById('result-stars');
            const evalTitle = document.getElementById('evaluation-title');
            const evalSubtitle = document.getElementById('evaluation-subtitle');

            let starCount = 1;
            if (correctCount === 5) {
                if (finalTime <= 12) {
                    starCount = 3;
                    evalTitle.textContent = '🏆 哇！超級速算神童！';
                    evalSubtitle.textContent = '速度極快而且全部答對！太神奇了！';
                } else {
                    starCount = 3;
                    evalTitle.textContent = '🌟 太棒了！速算小達人！';
                    evalSubtitle.textContent = '全都答對囉！下次挑戰更快的速度吧！';
                }
            } else if (correctCount >= 3) {
                starCount = 2;
                evalTitle.textContent = '👍 很棒的表現喔！';
                evalSubtitle.textContent = '已經熟練掌握1位數加法囉！繼續加油！';
            } else {
                starCount = 1;
                evalTitle.textContent = '💪 再接再厲！';
                evalSubtitle.textContent = '多練習幾次，你一定會算得又快又準！';
            }

            // Render Stars
            starsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const star = document.createElement('span');
                star.className = i < starCount ? 'text-amber-400 animate-bounce-short' : 'text-slate-200';
                star.style.animationDelay = `${i * 0.15}s`;
                star.textContent = '⭐';
                starsContainer.appendChild(star);
            }

            // High Score Check (if 5/5 correct)
            const newBestTag = document.getElementById('new-best-tag');
            if (correctCount === 5) {
                if (state.bestTime === null || finalTime < state.bestTime) {
                    state.bestTime = finalTime;
                    localStorage.setItem('math_speed_best_time', finalTime.toString());
                    updateBestScoreUI();
                    newBestTag.classList.remove('hidden');
                    newBestTag.classList.add('flex');
                } else {
                    newBestTag.classList.add('hidden');
                    newBestTag.classList.remove('flex');
                }
            } else {
                newBestTag.classList.add('hidden');
                newBestTag.classList.remove('flex');
            }

            showScreen('result');

            // Sound and Confetti on high achievement
            if (correctCount >= 4) {
                sound.playVictory();
                confetti.launch();
            }
        }

        /* ==========================================================================
           4. Event Listeners & Keyboard Input
           ========================================================================== */

        // Start & Replay Buttons
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('play-again-btn').addEventListener('click', startGame);

        // Virtual Keypad Click Delegation
        document.querySelectorAll('.key-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const key = btn.getAttribute('data-key');
                handleKeyInput(key);
            });
        });

        // Physical Keyboard Support
        window.addEventListener('keydown', (e) => {
            // Only react when in game screen
            if (screens.game.classList.contains('hidden')) return;

            let keyMapped = null;
            if (e.key >= '0' && e.key <= '9') {
                keyMapped = e.key;
            } else if (e.key === 'Backspace') {
                keyMapped = 'backspace';
            } else if (e.key === 'Enter') {
                keyMapped = 'enter';
            }

            if (keyMapped) {
                e.preventDefault();
                
                // Highlight corresponding virtual button briefly
                const targetBtn = document.querySelector(`.key-btn[data-key="${keyMapped}"]`);
                if (targetBtn) {
                    targetBtn.classList.add('active-key');
                    setTimeout(() => targetBtn.classList.remove('active-key'), 120);
                }
                
                handleKeyInput(keyMapped);
            }
        });

    </script>
</body>
</html>
